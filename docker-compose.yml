version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: ai_insurance_mongodb
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai_insurance_redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: ai_insurance_api
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/ai_insurance_claims
      REDIS_URL: redis://redis:6379
      JWT_SECRET: super_secret_jwt_key_ai_insurance_2026_production_ready
      AI_PROVIDER: MOCK
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: ai_insurance_worker
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/ai_insurance_claims
      REDIS_URL: redis://redis:6379
      AI_PROVIDER: MOCK
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: ai_insurance_web
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
    depends_on:
      - api

volumes:
  mongo_data:
