services:
  - type: web
    name: claimflow-ai-api
    env: node
    buildCommand: npm install && npm run build:shared && npm run build:api
    startCommand: cd apps/api && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false

  - type: worker
    name: claimflow-ai-worker
    env: node
    buildCommand: npm install && npm run build:shared && npm run build:worker
    startCommand: cd apps/worker && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
